<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홍길동 — 웹 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="card" id="card">
    <header class="card__header">
      <div class="avatar" role="img" aria-label="홍길동 캐릭터 일러스트">
        <svg class="avatar__svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="skin" x1="30%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F0D4BE" />
              <stop offset="55%" stop-color="#E8B89A" />
              <stop offset="100%" stop-color="#D9A688" />
            </linearGradient>
            <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1a1520" />
              <stop offset="45%" stop-color="#2d2435" />
              <stop offset="100%" stop-color="#121018" />
            </linearGradient>
            <linearGradient id="hairShine" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(255,255,255,0)" />
              <stop offset="42%" stop-color="rgba(200,220,255,0.45)" />
              <stop offset="58%" stop-color="rgba(255,255,255,0.15)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>
            <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#2a3548" />
              <stop offset="100%" stop-color="#1c2433" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
            </filter>
          </defs>

          <!-- shoulders / shirt -->
          <path d="M20 228 Q100 200 180 228 L180 240 L20 240 Z" fill="url(#shirt)" />
          <path d="M72 188 L72 218 Q100 232 128 218 L128 188" fill="#151a24" opacity="0.9" />

          <!-- hair volume (back) -->
          <path
            d="M38 108 C28 72 52 28 100 22 C148 28 172 72 162 108 C168 88 172 58 164 40 C150 12 120 0 100 0 C80 0 50 12 36 40 C28 58 32 88 38 108 Z"
            fill="url(#hair)"
            filter="url(#softShadow)"
          />

          <!-- neck -->
          <path d="M76 154 L74 198 Q100 212 126 198 L124 154 Z" fill="url(#skin)" />

          <!-- face: defined jaw -->
          <path
            d="M100 52
               C135 52 158 78 158 112
               C158 138 148 158 128 172
               C118 182 100 186 100 186
               C100 186 82 182 72 172
               C52 158 42 138 42 112
               C42 78 65 52 100 52 Z"
            fill="url(#skin)"
          />

          <!-- subtle contour -->
          <path
            d="M52 118 Q46 145 58 162"
            fill="none"
            stroke="#C8956E"
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.28"
          />
          <path
            d="M148 118 Q154 145 142 162"
            fill="none"
            stroke="#C8956E"
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.28"
          />

          <!-- cool eyebrows -->
          <path d="M62 88 L88 84" stroke="#2C2420" stroke-width="4" stroke-linecap="round" />
          <path d="M138 84 L112 88" stroke="#2C2420" stroke-width="4" stroke-linecap="round" />

          <!-- eyes -->
          <path d="M66 104 Q78 96 92 104 Q78 110 66 104" fill="#1a1512" />
          <path d="M134 104 Q122 96 108 104 Q122 110 134 104" fill="#1a1512" />
          <ellipse cx="78" cy="102" rx="3.5" ry="2.2" fill="#E8F4FF" opacity="0.95" />
          <ellipse cx="122" cy="102" rx="3.5" ry="2.2" fill="#E8F4FF" opacity="0.95" />

          <!-- nose -->
          <path
            d="M100 112 L98 130 Q100 134 102 130 Z"
            fill="none"
            stroke="#C48660"
            stroke-width="1.8"
            stroke-linejoin="round"
            opacity="0.45"
          />

          <!-- confident closed-lip smirk -->
          <path
            d="M86 148 Q100 152 118 146"
            fill="none"
            stroke="#A85D48"
            stroke-width="2.8"
            stroke-linecap="round"
          />
          <path d="M116 144 Q118 142 120 143" fill="none" stroke="#A85D48" stroke-width="2" stroke-linecap="round" opacity="0.7" />

          <!-- light stubble -->
          <g fill="#6B5346" opacity="0.12">
            <circle cx="82" cy="156" r="1.2" />
            <circle cx="92" cy="162" r="1" />
            <circle cx="100" cy="164" r="1.1" />
            <circle cx="108" cy="162" r="1" />
            <circle cx="118" cy="156" r="1.2" />
            <circle cx="74" cy="148" r="0.9" />
            <circle cx="126" cy="148" r="0.9" />
          </g>

          <!-- hair front: swept-back executive style -->
          <path
            d="M40 96
               C48 44 72 24 100 20
               C128 24 152 44 160 96
               C152 78 136 62 118 58
               C105 55 95 55 82 58
               C64 62 48 78 40 96 Z"
            fill="url(#hair)"
          />
          <path
            d="M54 72 Q100 38 146 72"
            fill="none"
            stroke="url(#hairShine)"
            stroke-width="10"
            stroke-linecap="round"
            opacity="0.85"
          />

          <!-- thin frame glasses (on top for clarity) -->
          <g fill="none" stroke="#dce5f2" stroke-width="2" stroke-linecap="round" opacity="0.95">
            <rect x="54" y="92" width="36" height="26" rx="5" />
            <rect x="110" y="92" width="36" height="26" rx="5" />
            <path d="M90 105 H110" />
            <path d="M50 100 Q42 97 36 92" />
            <path d="M150 100 Q158 97 164 92" />
          </g>
        </svg>
      </div>
      <div class="card__titles">
        <h1 class="name">홍길동</h1>
        <p class="role">드림컴퍼니 대표</p>
      </div>
    </header>

    <blockquote class="tagline">
      <p>AI와 함께 놀고 있습니다. 같이 노실 분?</p>
    </blockquote>

    <ul class="contacts" aria-label="연락처">
      <li>
        <a href="mailto:gittestsite1@gmail.com" class="contact">
          <span class="contact__icon" aria-hidden="true">✉</span>
          <span class="contact__text">gittestsite1@gmail.com</span>
        </a>
      </li>
      <li>
        <a href="tel:+821098761234" class="contact">
          <span class="contact__icon" aria-hidden="true">☎</span>
          <span class="contact__text">010-9876-1234</span>
        </a>
      </li>
      <li>
        <a
          href="https://www.linkedin.com/"
          class="contact contact--linkedin"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="contact__icon contact__icon--svg" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </span>
          <span class="contact__text">LinkedIn</span>
        </a>
      </li>
      <li>
        <a
          href="https://www.youtube.com/@ai-study"
          class="contact contact--youtube"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="contact__icon contact__icon--svg" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path fill="currentColor" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </span>
          <span class="contact__text">YouTube · @ai-study</span>
        </a>
      </li>
    </ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
